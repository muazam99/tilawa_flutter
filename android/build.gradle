group 'dev.tilawa.flutter'
version '1.0'

buildscript {
    repositories { google(); mavenCentral() }
    dependencies { classpath 'com.android.tools.build:gradle:8.6.1' }
}
apply plugin: 'com.android.library'
android {
    namespace 'dev.tilawa.flutter'
    compileSdk 35
    defaultConfig {
        minSdk 24
        consumerProguardFiles 'consumer-rules.pro'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
repositories { google(); mavenCentral() }
dependencies {
    implementation('com.microsoft.onnxruntime:onnxruntime-android:1.24.2') {
        version { strictly '1.24.2' }
    }
}
